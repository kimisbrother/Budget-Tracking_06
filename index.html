<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clio Group Budget Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F5F4F0; --surface: #FFFFFF; --surface-2: #F0EFE9;
    --border: rgba(0,0,0,0.08); --border-strong: rgba(0,0,0,0.14);
    --text-primary: #1A1A18; --text-secondary: #6B6B65; --text-muted: #A8A8A2;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; padding-bottom: 60px; }

  /* HEADER */
  .page-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 40px; position: sticky; top: 0; z-index: 100; }
  .header-inner { display: flex; align-items: stretch; height: 56px; }
  .brand-tabs { display: flex; }
  .brand-tab {
    display: flex; align-items: center; gap: 8px; padding: 0 20px;
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    cursor: pointer; border-bottom: 2px solid transparent;
    border-top: none; border-left: none; border-right: none;
    background: none; font-family: inherit; transition: all 0.15s; white-space: nowrap;
  }
  .brand-tab:hover { color: var(--text-primary); }
  .brand-tab.active { color: var(--text-primary); border-bottom-color: var(--tab-color, #1A1A18); }
  .brand-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tab-color, #ccc); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  /* DATE RANGE PICKER */
  .date-range { display: flex; align-items: center; gap: 6px; }
  .date-input-wrap input[type="date"] {
    font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500;
    color: var(--text-secondary); background: var(--surface-2);
    border: 1px solid var(--border-strong); border-radius: 6px;
    padding: 4px 8px; cursor: pointer; outline: none;
    transition: border-color 0.12s, background 0.12s; width: 122px;
  }
  .date-input-wrap input[type="date"]:focus,
  .date-input-wrap input[type="date"]:hover { border-color: #888; background: var(--surface); color: var(--text-primary); }
  .date-sep { font-size: 11px; color: var(--text-muted); }
  .date-apply-btn {
    font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: 6px;
    border: none; background: var(--text-primary); color: #fff;
    cursor: pointer; font-family: inherit; transition: opacity 0.12s;
  }
  .date-apply-btn:hover { opacity: 0.75; }
  .date-reset-btn {
    font-size: 11px; font-weight: 500; padding: 5px 8px; border-radius: 6px;
    border: 1px solid var(--border-strong); background: none; color: var(--text-secondary);
    cursor: pointer; font-family: inherit; transition: all 0.12s; display: none;
  }
  .date-reset-btn:hover { background: var(--surface-2); color: var(--text-primary); }
  .date-active-badge {
    font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 5px;
    background: #EEF0FB; color: #5364CC; white-space: nowrap; display: none;
  }
  .date-active-badge.visible { display: inline-block; }

  .sync-btn {
    font-size: 11px; font-weight: 500; padding: 5px 12px; border-radius: 6px;
    border: 1px solid var(--border-strong); background: none; color: var(--text-secondary);
    cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; transition: all 0.12s;
  }
  .sync-btn:hover { background: var(--surface-2); color: var(--text-primary); }
  .sync-btn.loading { opacity: 0.5; pointer-events: none; }
  .sync-icon { display: inline-block; }
  .sync-btn.loading .sync-icon { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .last-updated { font-size: 11px; color: var(--text-muted); }

  /* STATE SCREENS */
  .state-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 320px; gap: 12px; color: var(--text-muted); font-size: 13px; }
  .loading-spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--text-secondary); border-radius: 50%; animation: spin 0.8s linear infinite; }

  /* MAIN */
  .main { padding: 32px 40px 0; }

  /* OVERVIEW */
  .overview-section { display: none; }
  .overview-section.visible { display: block; }
  .overview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 28px; }
  .overview-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
  .overview-card:hover { border-color: var(--card-color); box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .oc-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .oc-brand { display: flex; align-items: center; gap: 7px; }
  .oc-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--card-color); }
  .oc-name { font-size: 14px; font-weight: 600; }
  .oc-pct-badge { font-size: 11px; font-weight: 600; font-family: 'DM Mono', monospace; padding: 3px 8px; border-radius: 6px; }
  .oc-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .oc-num-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
  .oc-num-val { font-size: 14px; font-weight: 500; font-family: 'DM Mono', monospace; }
  .oc-track { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .oc-bar { height: 100%; border-radius: 99px; background: var(--card-color); }

  /* HERO */
  .brand-hero { display: none; margin-bottom: 28px; }
  .brand-hero.visible { display: block; }
  .hero-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px; }
  .hero-name { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  .hero-subtitle { font-size: 13px; color: var(--text-muted); font-style: italic; }
  .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .hero-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .hero-stat-label { font-size: 10px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .hero-stat-val { font-size: 17px; font-weight: 600; font-family: 'DM Mono', monospace; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hero-pacing { grid-column: span 4; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; }
  .pacing-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .pacing-label { font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .pacing-pct { font-size: 18px; font-weight: 600; font-family: 'DM Mono', monospace; }
  .prog-track { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .prog-bar { height: 100%; border-radius: 99px; }

  /* SECTION */
  .section-block { margin-bottom: 20px; }
  .section-header { display: flex; align-items: center; justify-content: space-between; padding: 0 0 10px 0; }
  .section-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }

  /* TABLE */
  .table-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .table-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); }
  .toolbar-title { font-size: 13px; font-weight: 500; }
  .filter-group { display: flex; gap: 4px; }
  .filter-btn { font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border-strong); background: none; color: var(--text-secondary); cursor: pointer; font-family: inherit; transition: all 0.12s; }
  .filter-btn:hover { background: var(--surface-2); }
  .filter-btn.active { background: var(--text-primary); color: #fff; border-color: var(--text-primary); }
  table { width: 100%; border-collapse: collapse; }
  thead th { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; padding: 10px 16px; text-align: left; background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
  thead th.right { text-align: right; }
  tbody td { padding: 10px 16px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody td.right { text-align: right; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #FAFAF8; }
  .mono { font-family: 'DM Mono', monospace; font-size: 12px; }
  .brand-chip { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; margin-right: 5px; letter-spacing: 0.02em; }
  .camp-name { font-size: 12px; color: var(--text-secondary); }
  .plat-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 5px; }
  .plat-dot { width: 5px; height: 5px; border-radius: 50%; }
  .pacing-cell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .mini-track { width: 54px; height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; flex-shrink: 0; }
  .mini-fill { height: 100%; border-radius: 99px; }
  .pct-text { font-size: 11px; font-weight: 600; font-family: 'DM Mono', monospace; min-width: 32px; text-align: right; }
</style>
</head>
<body>

<header class="page-header">
  <div class="header-inner">
    <nav class="brand-tabs" id="brand-tabs">
      <button class="brand-tab active" data-brand="All" style="--tab-color:#1A1A18">All brands</button>
      <button class="brand-tab" data-brand="CLIO" style="--tab-color:#5364CC"><span class="brand-dot" style="--tab-color:#5364CC"></span>Clio</button>
      <button class="brand-tab" data-brand="Goodal" style="--tab-color:#2A9D6F"><span class="brand-dot" style="--tab-color:#2A9D6F"></span>Goodal</button>
      <button class="brand-tab" data-brand="Peripera" style="--tab-color:#D4537E"><span class="brand-dot" style="--tab-color:#D4537E"></span>Peripera</button>
    </nav>
    <div class="header-right">
      <!-- DATE RANGE FILTER -->
      <div class="date-range">
        <span class="date-active-badge" id="date-active-badge"></span>
        <div class="date-input-wrap">
          <input type="date" id="date-start" title="Start date">
        </div>
        <span class="date-sep">–</span>
        <div class="date-input-wrap">
          <input type="date" id="date-end" title="End date">
        </div>
        <button class="date-apply-btn" onclick="applyDateFilter()">Apply</button>
        <button class="date-reset-btn" id="date-reset-btn" onclick="resetDateFilter()">Reset</button>
      </div>
      <span class="last-updated" id="last-updated"></span>
      <button class="sync-btn" id="sync-btn" onclick="loadData()">
        <span class="sync-icon">↻</span> Sync
      </button>
    </div>
  </div>
</header>

<main class="main" id="main-content">
  <div class="state-screen" id="loading-screen">
    <div class="loading-spinner"></div>
    <span>Loading from Google Sheets…</span>
  </div>
</main>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS64iMIlE5ks8yNVvTON5qTeZqH9hQ6MQoAsUSTLMG57LoZQ4RnEeUmZfpCDiT9ZOLb765g4kt2sWvA/pub?gid=1587796187&single=true&output=csv";
const BRAND_COLORS  = { CLIO:"#5364CC", Goodal:"#2A9D6F", Peripera:"#D4537E" };
const BRAND_LIGHT   = { CLIO:"#EEF0FB", Goodal:"#E6F5EF", Peripera:"#FAEDF3" };
const BRAND_DISPLAY = { CLIO:"Clio", Goodal:"Goodal", Peripera:"Peripera" };

let RAW_DATA        = [];     // all rows, never mutated
let DATA            = [];     // rows after date filter
let activeBrand     = "All";
let activePlat      = "All";
let dateFilterStart = null;   // "YYYY-MM-DD" or null
let dateFilterEnd   = null;

// ── CSV PARSER ───────────────────────────────────────────────────────
// Sheet column order: 날짜 | Brand | Product | Platform | Campaign | Total Spent | Budget | Budget Left
function parseCSV(text) {
  const rows = text.trim().split("\n").map(l => {
    const result = []; let cur = "", inQ = false;
    for (let i = 0; i < l.length; i++) {
      const ch = l[i];
      if (ch === '"') { inQ = !inQ; continue; }
      if (ch === ',' && !inQ) { result.push(cur.trim()); cur = ""; continue; }
      cur += ch;
    }
    result.push(cur.trim());
    return result;
  });

  const hdr = rows[0].map(h => h.toLowerCase().trim());
  const gi  = k => hdr.findIndex(h => h.includes(k));

  const iD  = gi("날짜") >= 0 ? gi("날짜") : gi("date");
  const iB  = gi("brand");
  const iPr = gi("product");
  const iP  = gi("platform");
  const iC  = gi("campaign");
  const iS  = gi("spent");
  // Budget: the column that contains "budget" but NOT "left" or "remain"
  const iBu = hdr.findIndex(h => h.includes("budget") && !h.includes("left") && !h.includes("remain"));
  const iL  = gi("left") >= 0 ? gi("left") : gi("remain");

  return rows.slice(1)
    .filter(r => r.length > 4 && r[iB] && r[iC] && r[iP])
    .filter(r => !r[iB].toLowerCase().includes("grand") && !r[iB].toLowerCase().includes("total"))
    .map(r => ({
      date:     iD >= 0 ? r[iD].trim() : "",
      brand:    r[iB].trim(),
      product:  (iPr >= 0 ? r[iPr] : "").trim(),
      platform: r[iP].trim(),
      campaign: r[iC].trim(),
      spent:    pn(r[iS]),
      budget:   pn(r[iBu]),
      left:     pn(r[iL]),
    }))
    .filter(r => r.budget > 0);
}

// ── UTILS ─────────────────────────────────────────────────────────────
function pn(s)       { return s ? parseFloat(s.replace(/[₩,\s]/g,"")) || 0 : 0; }
function fmtFull(n)  { return "₩" + Math.round(n).toLocaleString("ko-KR"); }
function fmtShort(n) { return "₩" + Math.round(n).toLocaleString("ko-KR"); }
function pct(s,b)  { return b ? Math.min(100, Math.round(s/b*100)) : 0; }
function pc(p)     { return p >= 85 ? "#C53030" : p >= 55 ? "#2A9D6F" : "#BA7517"; }
function badgeStyle(p) { return p >= 85 ? "background:#FEE2E2;color:#C53030" : p >= 55 ? "background:#E6F5EF;color:#2A9D6F" : "background:#FEF3DC;color:#BA7517"; }
function fmtDate(d) { const [,m,day] = d.split("-"); return `${parseInt(m)}/${parseInt(day)}`; }

function daysLeft() {
  const now = new Date();
  const end = dateFilterEnd ? new Date(dateFilterEnd) : new Date(now.getFullYear(), 5, 30);
  return Math.max(Math.ceil((end - now) / 86400000), 1);
}
function dailyRec(left) { return left > 0 ? Math.round(left / daysLeft()) : 0; }

// ── DATE FILTER ───────────────────────────────────────────────────────
function applyDateFilter() {
  const s = document.getElementById("date-start").value;
  const e = document.getElementById("date-end").value;
  if (!s && !e) { resetDateFilter(); return; }

  dateFilterStart = s || null;
  dateFilterEnd   = e || null;

  const label = s && e ? `${fmtDate(s)} – ${fmtDate(e)}` : s ? `From ${fmtDate(s)}` : `Until ${fmtDate(e)}`;
  const badge = document.getElementById("date-active-badge");
  badge.textContent = label;
  badge.classList.add("visible");
  document.getElementById("date-reset-btn").style.display = "inline-block";

  filterAndRender();
}

function resetDateFilter() {
  dateFilterStart = null;
  dateFilterEnd   = null;
  document.getElementById("date-start").value = "";
  document.getElementById("date-end").value   = "";
  document.getElementById("date-active-badge").classList.remove("visible");
  document.getElementById("date-reset-btn").style.display = "none";
  filterAndRender();
}

function filterAndRender() {
  DATA = RAW_DATA.filter(r => {
    if (dateFilterStart && r.date && r.date < dateFilterStart) return false;
    if (dateFilterEnd   && r.date && r.date > dateFilterEnd)   return false;
    return true;
  });
  renderAll();
}

function setupDateInputs() {
  // Auto-apply when both dates filled via picker
  document.getElementById("date-start").addEventListener("change", () => {
    if (document.getElementById("date-start").value && document.getElementById("date-end").value) applyDateFilter();
  });
  document.getElementById("date-end").addEventListener("change", () => {
    if (document.getElementById("date-start").value && document.getElementById("date-end").value) applyDateFilter();
  });
  // Enter key on either input
  ["date-start","date-end"].forEach(id =>
    document.getElementById(id).addEventListener("keydown", e => { if (e.key === "Enter") applyDateFilter(); })
  );
}

// ── LOAD DATA ─────────────────────────────────────────────────────────
async function loadData() {
  const btn = document.getElementById("sync-btn");
  btn.classList.add("loading");
  try {
    const res = await fetch(CSV_URL + "&cb=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    RAW_DATA = parseCSV(text);
    if (!RAW_DATA.length) throw new Error("No data found — check sheet permissions");

    // Set date input bounds to available date range
    const dates = RAW_DATA.map(r => r.date).filter(Boolean).sort();
    if (dates.length) {
      const minD = dates[0], maxD = dates[dates.length-1];
      ["date-start","date-end"].forEach(id => {
        document.getElementById(id).min = minD;
        document.getElementById(id).max = maxD;
      });
    }

    DATA = [...RAW_DATA];
    renderAll();

    const n = new Date();
    document.getElementById("last-updated").textContent =
      "Updated " + String(n.getHours()).padStart(2,"0") + ":" + String(n.getMinutes()).padStart(2,"0");
  } catch(e) {
    document.getElementById("main-content").innerHTML = `
      <div class="state-screen">
        <span style="font-size:28px">⚠️</span>
        <span style="font-weight:500;color:var(--text-secondary)">Could not load data</span>
        <span style="font-size:12px;color:var(--text-muted)">${e.message}</span>
        <button class="filter-btn" onclick="loadData()" style="margin-top:8px">Try again</button>
      </div>`;
  } finally {
    btn.classList.remove("loading");
  }
}

// ── DATE LABEL for hero subtitle ──────────────────────────────────────
function getDateLabel() {
  if (dateFilterStart && dateFilterEnd) return `${fmtDate(dateFilterStart)} ~ ${fmtDate(dateFilterEnd)}`;
  const dates = DATA.map(r => r.date).filter(Boolean).sort();
  if (!dates.length) return "";
  return `${fmtDate(dates[0])} ~ ${fmtDate(dates[dates.length-1])}`;
}

// ── RENDER ────────────────────────────────────────────────────────────
function renderAll() {
  document.getElementById("main-content").innerHTML = `
    <div class="overview-section visible" id="overview-section"></div>
    <div class="brand-hero" id="brand-hero"></div>
    <div class="section-block">
      <div class="section-header">
        <span class="section-title">By Product</span>
        <div class="filter-group" id="prod-plat-filters">
          <button class="filter-btn active" data-plat="All">All</button>
          <button class="filter-btn" data-plat="Meta">Meta</button>
          <button class="filter-btn" data-plat="TikTok">TikTok</button>
        </div>
      </div>
      <div class="table-section">
        <div class="table-toolbar"><span class="toolbar-title" id="prod-toolbar-title"></span></div>
        <div style="overflow-x:auto"><table>
          <thead><tr>
            <th>Product</th><th class="right">Budget</th><th class="right">Spent</th>
            <th class="right">Pacing</th><th class="right">Remaining</th><th class="right">Daily rec.</th>
          </tr></thead>
          <tbody id="prod-table-body"></tbody>
        </table></div>
      </div>
    </div>
    <div class="section-block">
      <div class="section-header">
        <span class="section-title">By Campaign</span>
        <div class="filter-group" id="camp-plat-filters">
          <button class="filter-btn active" data-plat="All">All</button>
          <button class="filter-btn" data-plat="Meta">Meta</button>
          <button class="filter-btn" data-plat="TikTok">TikTok</button>
        </div>
      </div>
      <div class="table-section">
        <div class="table-toolbar"><span class="toolbar-title" id="camp-toolbar-title"></span></div>
        <div style="overflow-x:auto"><table>
          <thead><tr>
            <th>Campaign</th><th>Platform</th><th class="right">Budget</th><th class="right">Spent</th>
            <th class="right">Pacing</th><th class="right">Remaining</th><th class="right">Daily rec.</th>
          </tr></thead>
          <tbody id="camp-table-body"></tbody>
        </table></div>
      </div>
    </div>`;

  // Restore platform filter active state after re-render
  ["prod-plat-filters","camp-plat-filters"].forEach(id => {
    document.getElementById(id).querySelectorAll(".filter-btn").forEach(b =>
      b.classList.toggle("active", b.dataset.plat === activePlat));
  });

  // Platform filter click handlers — both tables stay in sync
  const syncPlat = plat => {
    activePlat = plat;
    ["prod-plat-filters","camp-plat-filters"].forEach(id =>
      document.getElementById(id).querySelectorAll(".filter-btn").forEach(x =>
        x.classList.toggle("active", x.dataset.plat === activePlat)));
    buildProductTable();
    buildCampaignTable();
  };
  document.getElementById("prod-plat-filters").addEventListener("click", e => { const b = e.target.closest(".filter-btn"); if (b) syncPlat(b.dataset.plat); });
  document.getElementById("camp-plat-filters").addEventListener("click", e => { const b = e.target.closest(".filter-btn"); if (b) syncPlat(b.dataset.plat); });

  buildOverview();
  switchBrand(activeBrand);
}

function buildOverview() {
  const brands = [...new Set(DATA.map(r => r.brand))];
  document.getElementById("overview-section").innerHTML = `<div class="overview-grid">${
    brands.map(b => {
      const rs  = DATA.filter(r => r.brand===b);
      const tot = rs.reduce((s,r)=>s+r.budget,0), sp = rs.reduce((s,r)=>s+r.spent,0);
      const lft = tot - sp;
      const p   = pct(sp,tot), col = BRAND_COLORS[b]||"#888";
      return `<div class="overview-card" style="--card-color:${col}" onclick="switchBrand('${b}')">
        <div class="oc-header">
          <div class="oc-brand"><span class="oc-dot"></span><span class="oc-name">${BRAND_DISPLAY[b]||b}</span></div>
          <span class="oc-pct-badge" style="${badgeStyle(p)}">${p}% spent</span>
        </div>
        <div class="oc-nums">
          <div><div class="oc-num-label">Total budget</div><div class="oc-num-val">${fmtShort(tot)}</div></div>
          <div><div class="oc-num-label">Spent</div><div class="oc-num-val" style="color:${col}">${fmtShort(sp)}</div></div>
          <div><div class="oc-num-label">Remaining</div><div class="oc-num-val">${fmtShort(lft)}</div></div>
          <div><div class="oc-num-label">Campaigns</div><div class="oc-num-val">${[...new Set(rs.map(r=>r.campaign))].length}</div></div>
        </div>
        <div class="oc-track"><div class="oc-bar" style="width:${p}%"></div></div>
      </div>`;
    }).join("")
  }</div>`;
}

function buildHero(brand) {
  const rs  = DATA.filter(r=>r.brand===brand);
  const tot = rs.reduce((s,r)=>s+r.budget,0), sp = rs.reduce((s,r)=>s+r.spent,0);
  const lft = tot - sp;
  const products = [...new Set(rs.map(r=>r.product))].filter(Boolean).length;
  const camps    = [...new Set(rs.map(r=>r.campaign))].length;
  const p = pct(sp,tot), col = BRAND_COLORS[brand]||"#888";
  document.getElementById("brand-hero").innerHTML = `
    <div class="hero-header">
      <span class="hero-name" style="color:${col}">${BRAND_DISPLAY[brand]||brand}</span>
      <span class="hero-subtitle">${getDateLabel()} Budget Tracking</span>
    </div>
    <div class="hero-stats">
      <div class="hero-stat"><div class="hero-stat-label">Total budget</div><div class="hero-stat-val">${fmtFull(tot)}</div></div>
      <div class="hero-stat"><div class="hero-stat-label">Spent</div><div class="hero-stat-val" style="color:${col}">${fmtFull(sp)}</div></div>
      <div class="hero-stat"><div class="hero-stat-label">Remaining</div><div class="hero-stat-val">${fmtFull(lft)}</div></div>
      <div class="hero-stat"><div class="hero-stat-label">Products · Campaigns</div><div class="hero-stat-val">${products} · ${camps}</div></div>
      <div class="hero-pacing">
        <div class="pacing-hdr">
          <span class="pacing-label">Overall pacing</span>
          <span class="pacing-pct" style="color:${pc(p)}">${p}%</span>
        </div>
        <div class="prog-track"><div class="prog-bar" style="width:${p}%;background:${col}"></div></div>
      </div>
    </div>`;
}

function buildProductTable() {
  let rows = DATA;
  if (activeBrand !== "All") rows = rows.filter(r=>r.brand===activeBrand);
  if (activePlat  !== "All") rows = rows.filter(r=>r.platform===activePlat);

  const prodMap = {};
  rows.forEach(r => {
    const key = r.brand + "||" + r.product;
    if (!prodMap[key]) prodMap[key] = { brand:r.brand, product:r.product, spent:0, budget:0, platforms:new Set() };
    prodMap[key].spent  += r.spent;
    prodMap[key].budget += r.budget;
    prodMap[key].platforms.add(r.platform);
  });

  const prods = Object.values(prodMap).map(r => ({ ...r, left: r.budget - r.spent }));
  document.getElementById("prod-toolbar-title").textContent =
    (activeBrand==="All" ? "All products" : `${BRAND_DISPLAY[activeBrand]||activeBrand} products`) + ` (${prods.length})`;

  document.getElementById("prod-table-body").innerHTML = prods.length === 0
    ? `<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text-muted);font-size:13px">No products</td></tr>`
    : prods.map(r => {
        const p = pct(r.spent,r.budget), col = BRAND_COLORS[r.brand]||"#888", lt = BRAND_LIGHT[r.brand]||"#eee";
        const plats = [...r.platforms];
        return `<tr>
          <td>
            <span class="brand-chip" style="background:${lt};color:${col}">${BRAND_DISPLAY[r.brand]||r.brand}</span>
            <span style="font-size:13px;font-weight:500">${r.product||'—'}</span>
            <div style="margin-top:4px;margin-left:${activeBrand==='All'?'70':'0'}px;display:flex;gap:4px;">
              ${plats.map(pl=>{ const isM=pl==="Meta"; return `<span class="plat-badge" style="font-size:10px;padding:2px 6px;background:${isM?'#EBF3FE':'#FEE8EE'};color:${isM?'#1877F2':'#EE1D52'}"><span class="plat-dot" style="width:4px;height:4px;background:${isM?'#1877F2':'#EE1D52'}"></span>${pl}</span>`; }).join("")}
            </div>
          </td>
          <td class="mono right">${fmtFull(r.budget)}</td>
          <td class="mono right">${fmtFull(r.spent)}</td>
          <td class="right"><div class="pacing-cell">
            <div class="mini-track"><div class="mini-fill" style="width:${p}%;background:${pc(p)}"></div></div>
            <span class="pct-text" style="color:${pc(p)}">${p}%</span>
          </div></td>
          <td class="mono right" style="color:#2A9D6F">${fmtFull(r.left)}</td>
          <td class="mono right" style="color:#BA7517">${fmtFull(dailyRec(r.left))}</td>
        </tr>`;
      }).join("");
}

function buildCampaignTable() {
  let rows = DATA;
  if (activeBrand !== "All") rows = rows.filter(r=>r.brand===activeBrand);
  if (activePlat  !== "All") rows = rows.filter(r=>r.platform===activePlat);

  // Group by brand + campaign + platform so date-split rows merge into one
  const campMap = {};
  rows.forEach(r => {
    const key = r.brand + "||" + r.campaign + "||" + r.platform;
    if (!campMap[key]) campMap[key] = { brand:r.brand, product:r.product, campaign:r.campaign, platform:r.platform, spent:0, budget:0 };
    campMap[key].spent  += r.spent;
    campMap[key].budget += r.budget;
  });
  const camps = Object.values(campMap).map(r => ({ ...r, left: r.budget - r.spent }));

  document.getElementById("camp-toolbar-title").textContent =
    (activeBrand==="All" ? "All campaigns" : `${BRAND_DISPLAY[activeBrand]||activeBrand} campaigns`) + ` (${camps.length})`;

  document.getElementById("camp-table-body").innerHTML = camps.length === 0
    ? `<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted);font-size:13px">No campaigns</td></tr>`
    : camps.map(r => {
        const p=pct(r.spent,r.budget), col=BRAND_COLORS[r.brand]||"#888", lt=BRAND_LIGHT[r.brand]||"#eee";
        const isM=r.platform==="Meta";
        return `<tr>
          <td>
            <span class="brand-chip" style="background:${lt};color:${col}">${BRAND_DISPLAY[r.brand]||r.brand}</span>
            ${r.product ? `<span style="font-size:11px;font-weight:500;color:var(--text-muted);margin-right:4px">${r.product}</span>` : ""}
            <span class="camp-name">${r.campaign}</span>
          </td>
          <td><span class="plat-badge" style="background:${isM?'#EBF3FE':'#FEE8EE'};color:${isM?'#1877F2':'#EE1D52'}">
            <span class="plat-dot" style="background:${isM?'#1877F2':'#EE1D52'}"></span>${r.platform}</span></td>
          <td class="mono right">${fmtFull(r.budget)}</td>
          <td class="mono right">${fmtFull(r.spent)}</td>
          <td class="right"><div class="pacing-cell">
            <div class="mini-track"><div class="mini-fill" style="width:${p}%;background:${pc(p)}"></div></div>
            <span class="pct-text" style="color:${pc(p)}">${p}%</span>
          </div></td>
          <td class="mono right" style="color:#2A9D6F">${fmtFull(r.left)}</td>
          <td class="mono right" style="color:#BA7517">${fmtFull(dailyRec(r.left))}</td>
        </tr>`;
      }).join("");
}

function switchBrand(b) {
  activeBrand = b;
  document.querySelectorAll(".brand-tab").forEach(t=>t.classList.toggle("active", t.dataset.brand===b));
  const ov   = document.getElementById("overview-section");
  const hero = document.getElementById("brand-hero");
  if (!ov || !hero) return;
  if (b==="All") { ov.classList.add("visible"); hero.classList.remove("visible"); }
  else           { ov.classList.remove("visible"); hero.classList.add("visible"); buildHero(b); }
  buildProductTable();
  buildCampaignTable();
}

document.getElementById("brand-tabs").addEventListener("click", e => {
  const btn = e.target.closest(".brand-tab");
  if (btn) switchBrand(btn.dataset.brand);
});

setupDateInputs();
loadData();
</script>
</body>
</html>
